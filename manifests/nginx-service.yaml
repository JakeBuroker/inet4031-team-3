apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert -f week-2/docker-compose.yml -o /tmp/week3-manifests
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    app: nginx
  name: nginx
spec:
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: nginx
  type: LoadBalancer
